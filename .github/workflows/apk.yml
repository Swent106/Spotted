# Portions of this file were generated with the help of Claude (Anthropic).
# Builds an installable debug APK on every push to main, and on demand from the Actions tab
# ("Run workflow"). Download it from the run's Artifacts section.
# Actions are pinned to full commit SHAs (version in the comment): a tag like v4 can be moved to
# other code, a commit cannot.
name: Build APK

on:
  push:
    branches: [ "main" ]
  # Also on PRs that change how the APK is built (workflow, signing, build scripts, dependencies,
  # manifest), so a broken build is caught before merging
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/apk.yml"
      - "app/build.gradle.kts"
      - "app/debug.keystore"
      - "app/src/main/AndroidManifest.xml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
  workflow_dispatch:

# Least privilege: the job only reads the repository. Uploading artifacts needs no extra permission.
permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo "$GOOGLE_SERVICES" | base64 --decode > app/google-services.json

      # Signed with app/debug.keystore (see signingConfigs in app/build.gradle.kts), whose SHA-1 is
      # registered in Firebase, so Google sign-in works on any phone.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spotted-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error