[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.19.1"
ktfmt = "0.27.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
composeBom = "2026.09.00"
composeActivity = "1.13.0"
composeViewModel = "2.11.0"
lifecycleRuntimeKtx = "2.11.0"
kaspresso = "1.6.1"
robolectric = "4.17"
sonar = "7.5.0.8588"
